# Omarchy 4.5's shell handles the screensaver and lock itself but never
# suspends. This adds only that: after 45 minutes idle (15 after the lock),
# suspend if running on battery. Video players and Stay Awake keep it awake.

general {
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

listener {
    timeout = 2700
    on-timeout = ~/.local/bin/suspend-if-on-battery
}
