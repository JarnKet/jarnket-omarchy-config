# Remove the include below to disconnect Kitty from Omarchy's theming system.
include ~/.local/state/omarchy/current/theme/kitty.conf

# Settings below override Omarchy's defaults in /etc/xdg/kitty/kitty.conf.
# Learn more: https://sw.kovidgoyal.net/kitty/conf/

# Font
# font_family JetBrainsMono Nerd Font
# font_size 12

# Window padding
# window_padding_width 14

# Unmap a shortcut, passing it through to the terminal application
# map ctrl+insert

# Set or replace a shortcut
# map ctrl+shift+c copy_to_clipboard

# Remove all inherited shortcuts, including Kitty's built-in shortcuts
# clear_all_shortcuts yes

font_size 9.0

# Smooth cursor: when the cursor jumps, a short trail follows it and fades out.
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# Caret (beam) cursor that fades in and out instead of blinking on and off.
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.5 ease-in-out

# Lao in "Lao Term": Noto Sans Lao refitted to the 0.6 em cell, so wide letters
# like ໝ ໜ keep full height instead of being shrunk (built by
# ~/.local/share/lao-term/make-lao-term.py). Back to stock: Noto Sans Lao.
symbol_map U+0E80-U+0EFF Lao Term
