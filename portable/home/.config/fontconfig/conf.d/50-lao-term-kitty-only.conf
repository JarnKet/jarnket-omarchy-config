<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  "Lao Term" (~/.local/share/fonts/LaoTerm-*.ttf) is Noto Sans Lao refitted to
  kitty's monospace cell. Outside kitty it breaks Lao: vowels and tone marks get
  their own width ("ລາ ວ"). Apps asking for a font that has no Lao letters
  (VS Code's system-ui, Inter, ...) fell back to it, because it sorted ahead of
  Noto Sans Lao.

  Append Noto Sans Lao (weak) to every request so it wins that fallback. kitty
  asks for "Lao Term" by name in symbol_map, which still matches it first.
-->
<fontconfig>
  <match target="pattern">
    <edit name="family" mode="append_last" binding="weak">
      <string>Noto Sans Lao</string>
    </edit>
  </match>
</fontconfig>
